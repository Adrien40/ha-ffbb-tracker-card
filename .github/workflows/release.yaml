name: Release

# Publishes a GitHub release from the changelog when a version tag is pushed
# (with or without the leading "v"):
#   git tag v0.7.3 && git push origin v0.7.3
# The tag must match CARD_VERSION in src/version.js, and CHANGELOG.md must
# contain a "## 0.7.3" section (CHANGELOG.fr.md is added when it has one too).
#
# dist/ is committed by the "Build dist" workflow *after* a push to main, so
# tag the commit it made ("chore: rebuild dist/"), not the source commit before
# it: this workflow rebuilds dist/ and refuses the release if what is committed
# at the tag isn't what its sources build, which would otherwise ship a stale
# bundle to every HACS user.
#
# No file is attached to the release on purpose: HACS installs the card from
# dist/ (the bundle and the brand/ icon the card falls back to as its logo),
# and attaching only the bundle could make it skip the rest.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check that dist/ is the build of this tag's sources
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ at this tag is not what its sources build. Tag the commit made by the 'Build dist' workflow (chore: rebuild dist/), not the source commit before it."
            exit 1
          fi

      - name: Build release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "${TAG#v}" > release_notes.md
          cat release_notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release_notes.md "${flags[@]}"
          else
            gh release create "$TAG" --title "$TAG" --notes-file release_notes.md --verify-tag "${flags[@]}"
          fi
